name: test
on:
  pull_request:
    branches: [ public-package ]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Macos arm setup only
        if: runner.os == 'macOS'
        run: |
          brew install cmake autoconf automake libtool nasm pkg-config zlib libimagequant
          brew list --versions
          sudo mkdir -p /usr/local/lib
          sudo ln -s `brew --prefix libpng`/lib/libpng16.a /usr/local/lib/libpng16.a
          echo "ASM_NASM=\"`brew --prefix nasm`/bin/nasm\"" >> $GITHUB_ENV
          echo "VERBOSE=true" >> $GITHUB_ENV
          echo "CPPFLAGS=-DPNG_ARM_NEON_OPT=0" >> $GITHUB_ENV
      - run: npm install
      - run: npm test
